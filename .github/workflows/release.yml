name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          tar -czf dist-release/source-v${VERSION}.tar.gz \
            --exclude=node_modules --exclude=.git --exclude=.svelte-kit --exclude=build --exclude=dist-release .
          (cd apps/coreskills/build && zip -qr ../../../dist-release/coreskills-v${VERSION}.zip .)
          (cd apps/corebase/build && zip -qr ../../../dist-release/corebase-v${VERSION}.zip .)
          (cd dist-release && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-release/*
